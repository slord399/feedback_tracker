services:
  poller:
    build: .
    image: canny-bot:latest
    container_name: canny-bot-poller
    command: python Bot/poller/main.py
    environment:
      - VALKEY_NODES=valkey-1:6379,valkey-2:6379,valkey-3:6379,valkey-10:6379,valkey-11:6379
    networks:
      - booth_evaluation_ops_default
    volumes:
      - locale-data:/app/Locale
    restart: always

  gateway-0:
    build: .
    image: canny-bot:latest
    container_name: canny-bot-gateway-0
    command: python Bot/gateway/main.py
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - SHARD_ID=0
      - TOTAL_SHARDS=2
      - VALKEY_NODES=valkey-1:6379,valkey-2:6379,valkey-3:6379,valkey-10:6379,valkey-11:6379
    networks:
      - booth_evaluation_ops_default
    volumes:
      - locale-data:/app/Locale
    restart: always

  gateway-1:
    build: .
    image: canny-bot:latest
    container_name: canny-bot-gateway-1
    command: python Bot/gateway/main.py
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - SHARD_ID=1
      - TOTAL_SHARDS=2
      - VALKEY_NODES=valkey-1:6379,valkey-2:6379,valkey-3:6379,valkey-10:6379,valkey-11:6379
    networks:
      - booth_evaluation_ops_default
    volumes:
      - locale-data:/app/Locale
    restart: always

  worker-0:
    build: .
    image: canny-bot:latest
    container_name: canny-bot-worker-0
    command: python Bot/worker/main.py
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - VALKEY_NODES=valkey-1:6379,valkey-2:6379,valkey-3:6379,valkey-10:6379,valkey-11:6379
    networks:
      - booth_evaluation_ops_default
    volumes:
      - locale-data:/app/Locale
    restart: always

  worker-1:
    build: .
    image: canny-bot:latest
    container_name: canny-bot-worker-1
    command: python Bot/worker/main.py
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - VALKEY_NODES=valkey-1:6379,valkey-2:6379,valkey-3:6379,valkey-10:6379,valkey-11:6379
    networks:
      - booth_evaluation_ops_default
    volumes:
      - locale-data:/app/Locale
    restart: always

networks:
  booth_evaluation_ops_default:
    name: booth_evaluation_ops_default

volumes:
  locale-data:
